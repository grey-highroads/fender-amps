<!doctype html><meta charset="utf-8"><title>Fender faceplates — evidence and artwork</title><style>body{max-width:1280px;margin:40px auto;background:#20262a;color:#eee;font:16px/1.5 system-ui}a{color:#a6d9e1}h1{font-size:32px}section{background:#12181b;margin:30px 0;padding:24px}img{width:100%;height:auto}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}figure{margin:0}figcaption,small{color:#bac6ca}.note{border-left:3px solid #a6d9e1;padding:12px 20px}li{margin:8px 0}code{font-size:13px}</style>
<h1>Faceplate lettering • review 1.0</h1><p>Seven shared reference assemblies. Original vector artwork, with hardware kept separate. Vintage photographs are linked, never embedded. The observations below are visual evidence; exact dimensions and artwork remain estimates.</p>
<div id="cards"></div><script>
const cards=[
 ['princeton','Princeton Reverb • 1965-style','faceplate-princeton','https://retrofret.com/products/fender-princeton-reverb-tube-amplifier-1965-9339','RetroFret A-03894, full-resolution front and rear','① Connected Princeton / Reverb-Amp replaces generic italic serif. The first line rises gently; the P has an open swept bowl. ② Channel heading is larger than the narrow control labels. ③ Thin perimeter, top ticks and small manufacturer line preserve empty space.','Exact curves, stroke modulation, registration and tiny patent wording remain approximate. Replacement speaker, tank, tubes and filter can are not factory specifications.'],
 ['deluxe','Deluxe Reverb • 1965-style','faceplate-deluxe','https://folkwaymusic.com/vintage-instruments/item/id.5437','Folkway early-1965 specimen, 1200 × 1800 front','① Two script lines: Deluxe / Reverb-Amp. ② NORMAL and VIBRATO sit below their input pairs; each channel restarts at 1, 2. ③ A divider separates the channels, and short index ticks meet the upper rule.','Mounted photo supports composition more confidently than exact curves. Early specimen lacks the raised badge retained in this family assembly.'],
 ['twin','Twin Reverb • early 1968','faceplate-twin','https://retrofret.com/products/fender-twin-reverb-ac-568-wfactory-jbls-large-combo-tube-amplifier-1968-13479','RetroFret A-13834, full-resolution angled front and control detail','① TWIN REVERB / -AMP is narrow, heavy and upright. ② Turquoise channel outlines and upper NORMAL / VIBRATO headings distinguish early silverface. ③ BRIGHT stays over each switch.','Exact outline weight, ink color and manufacturer text are estimates. This production assembly remains Oxford-equipped; the specimen has the factory JBL option.'],
 ['brown','Brown Deluxe • 1962 6G3','faceplate-brown-deluxe','https://themusicemporium.com/products/fender-6g3-deluxe-1962','D02985: AMP26002-3 title, -4 controls, -12 rear','① Swept script Deluxe / -Amp, with a prominent D. ② Three bordered fields organize Normal, Bright and tremolo/title. ③ Inputs restart at 1, 2; numbers 1–10 belong to the plate, not the barrel knob.','Original curves and registration remain approximate. Rear ON moves above the switch, and manufacturer printing is split across lines.'],
 ['5e3','Tweed Deluxe • 1957 5E3','faceplate-5e3','https://www.andybaxterbass.com/products/1956-fender-deluxe','D-03176: IMG_4077 full panel, plus mounted rear/top views','① Ivory narrow labels and 1–12 scales replace the sparse generic artwork. ② INST. and MIC. sit beneath the socket columns, with 2 above 1. ③ Photo-backed layout correction moves Tone / Instrument / Mic right and restores ground, fuse and power hardware before the pilot.','Hardware centers are proportional estimates from the photograph, not measured chassis dimensions. No model title is invented on this control plate.'],
 ['tremolux','Early Tremolux • 1955 5E9','faceplate-tremolux','https://retrofret.com/products/fender-tremolux-model-5e9-tube-amplifier-1955-10792','RetroFret 10792: image 05 top panel','① DEPTH / SPEED / TONE / INST. VOL. / MIC. VOL. retain the early sequence. ② Fine labels and 1–12 scales suit the chrome panel. ③ Stacked input numbering follows the rows.','Socket-heading/fuse wording is partly worn or obscured; those details remain estimates. No later Tremolux title or lettering is borrowed.'],
 ['champ','Champ • 1959 5F1','faceplate-champ','https://retrofret.com/products/fender-champ-amp-5f1-tube-amplifier-1959-8054','RetroFret 8054: image 05 top panel','① 2 AMP / OFF VOLUME ON / INSTRUMENTS follow the photographed wording. ② Inputs 1, 2 sit above their sockets; volume runs to 12. ③ One lower rule and generous open space replace the enclosing generic border.','Stroke widths and scale spacing are estimates. The photographed control plate has no CHAMP-AMP title, so none is added.']
];
for(const [name,title,plate,link,photo,decisions,limits]of cards){const s=document.createElement('section');s.innerHTML=`<h2>${title}</h2><p><a href="${link}">Open vintage reference ↗</a> · ${photo}</p><img src="../../dist/assets/panels/${plate}.svg" alt="Revised flat ${title} artwork"><p class="note">${decisions}</p><div class="pair"><figure><img src="../../docs/handoff/images/typography/${name}-amp-angle-before.png"><figcaption>Previous • same camera, scale and lighting</figcaption></figure><figure><img src="../../docs/handoff/images/typography/${name}-amp-angle-after.png"><figcaption>Revised • shared runtime</figcaption></figure></div><p><a href="../../docs/handoff/images/typography/${name==='brown'?'brown-deluxe':name}-close.png">Open component close view</a> · <a href="../../dist/assets/panels/${plate}.svg">Open editable SVG</a></p><small>${limits}</small>`;document.querySelector('#cards').append(s);}
</script>
