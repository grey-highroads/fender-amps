<h1>Faceplates • lettering study 1.0</h1><p>Flat artwork extracted from the shared runtime. Before above / revised below. Hardware is separate.</p><div id="plates"></div>
<script type="module">
const {PANEL_IDS}=await import('/dist/library/panel-lettering.js');

</script>
