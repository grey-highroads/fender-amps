name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate component references, dimensions and speaker loads
        run: npm test
      - name: Check application JavaScript syntax
        run: |
          for file in dist/*.js dist/library/*.js; do
            node --check "$file"
          done
